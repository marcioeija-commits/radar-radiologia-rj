name: Monitoramento Radar Radiologia RJ

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Executar monitoramento
        run: |
          response=$(curl --fail-with-body -sS -X POST \
            "https://radar-radiologia-rj.onrender.com/api/scheduled/monitor-radiologia" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          echo "===== RESULTADO DO MONITORAMENTO ====="
          echo "$response"
          echo "===== FIM DO MONITORAMENTO ====="
